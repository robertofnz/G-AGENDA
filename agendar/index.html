<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>G.agenda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#FFF8F2;--surface:#fff;--ink:#2B1A0E;--muted:#7A6657;--line:#F0DDD0;--brand:#FE6A00;--brand-ink:#1F1100;--brandtx:#B34700;--soft:#FFEBDD;--taken:#F3E9E1;--ok:#1E8E5A;--warn:#B45F06;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17110C;--surface:#231A13;--ink:#F7EFE8;--muted:#B9A898;--line:#3A2C20;--brand:#FF7A1A;--brand-ink:#1F1100;--brandtx:#FF9A4D;--soft:#34231A;--taken:#2C211A;--ok:#4CC38A;--warn:#F2B45C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17110C;--surface:#231A13;--ink:#F7EFE8;--muted:#B9A898;--line:#3A2C20;--brand:#FF7A1A;--brand-ink:#1F1100;--brandtx:#FF9A4D;--soft:#34231A;--taken:#2C211A;--ok:#4CC38A;--warn:#F2B45C;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:440px;margin:0 auto;padding:12px 16px 90px}
h1{font-size:20px;margin:0}.brand{display:flex;align-items:center;gap:10px}.logo{height:34px;width:auto;display:block}h2{font-size:22px;margin:18px 0 4px;line-height:1.2}
p{margin:0;color:var(--muted)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
button{font:inherit;color:inherit}
.dots{display:flex;gap:6px;margin:10px 0 0}.dots i{flex:1;height:4px;border-radius:4px;background:var(--line)}.dots i.on{background:var(--brand)}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:10px;cursor:pointer}
.opt b{display:block;font-weight:700}.opt span{color:var(--muted);font-size:14px}
.opt.on{border-color:var(--brand);background:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer}
.chip.on{border-color:var(--brand);background:var(--soft);font-weight:500}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.slot{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 0;cursor:pointer;font-size:15px}
.slot.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.slot:disabled{background:var(--taken);color:var(--muted);text-decoration:line-through;cursor:not-allowed;border-color:var(--taken)}
label{display:block;font-size:14px;font-weight:500;margin:14px 0 5px}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px}
textarea{min-height:76px;resize:vertical}
input:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted);margin-top:14px}
.check input{margin-top:3px;accent-color:var(--brand)}
.bar{position:sticky;bottom:0;padding:12px 0 8px;background:linear-gradient(transparent,var(--bg) 30%);display:flex;gap:10px;margin-top:16px}
.btn{flex:1;border:0;border-radius:12px;padding:14px;background:var(--brand);color:var(--brand-ink);font-weight:700;cursor:pointer;text-align:center;text-decoration:none;display:block}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn.ghost{flex:0 0 auto;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);font-weight:500;padding:14px 18px}
.err{color:var(--warn);font-size:14px;margin-top:10px;min-height:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.big{text-align:center;padding:26px 8px 6px}.big .ic{width:56px;height:56px;border-radius:50%;background:var(--ok);color:#fff;font-size:30px;display:grid;place-items:center;margin:0 auto 12px}
.step{display:flex;align-items:center;gap:12px}.step button{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:20px;cursor:pointer}
.opt .em{font-size:30px;line-height:1;color:inherit}
.wbtn{display:flex;align-items:center;gap:14px;margin-top:18px;padding:14px 16px;border-radius:16px;background:#167A4B;color:#fff;text-decoration:none;box-shadow:0 6px 16px rgba(22,122,75,.28)}.wbtn b{display:block;font-size:17px}.wbtn small{display:block;font-size:13px;opacity:.92}.wi{font-size:28px;line-height:1}
.cn{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:20px;cursor:pointer}.cn:disabled{opacity:.4;cursor:not-allowed}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}.cg i{font-style:normal;font-size:12px;color:var(--muted);text-align:center}
.cd{aspect-ratio:1;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;font-size:15px;cursor:pointer;padding:0}.cd.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}.cd:disabled{background:transparent;border-color:transparent;color:var(--muted);opacity:.45;cursor:not-allowed}
</style>
</head>

  h+='<div class="err">'+S.err+"</div>"+bar("next","Continuar",1);
 }else if(S.step===3){
  h=dots()+"<h2>Escolha o dia e o horário</h2><p>Dias apagados não têm vaga. Horários riscados já foram reservados.</p>";
  h+=cal();
  if(S.day){h+='<p style="margin-top:14px"><b>'+dlabel(S.day)+'</b></p><div class="slots">';so(S.day).forEach(function(t){var k=S.day+" "+t;h+='<button class="slot'+(S.slot===t?" on":"")+'" data-act="slot" data-v="'+t+'"'+(taken(k)?" disabled":"")+">"+t+"</button>"});h+="</div>"}
  h+='<div class="err">'+S.err+"</div>"+bar("next","Continuar",1);
 }else if(S.step===4){
  h=dots()+"<h2>Onde será o atendimento?</h2>";
  if(S.who==="Empresa")h+='<label>Nome da empresa</label><input type="text" data-f="emp" value="'+esc(S.emp)+'"><label>CNPJ</label><input type="text" data-f="cnpj" inputmode="numeric" value="'+esc(S.cnpj)+'"><label>Pessoa de contato</label><input type="text" data-f="cont" value="'+esc(S.cont)+'">';
  else h+='<label>Seu nome</label><input type="text" data-f="cont" value="'+esc(S.cont)+'">';
  h+='<label>WhatsApp com DDD</label><input type="text" data-f="tel" inputmode="tel" placeholder="(67) 99999-9999" value="'+esc(S.tel)+'"><label>Endereço completo</label><input type="text" data-f="addr" placeholder="Rua, número, bairro" value="'+esc(S.addr)+'"><label>Observações</label><div class="chips" style="margin:0 0 8px">';
  ["Moro em casa","Moro em apartamento","Tem portaria","Cuidado com o cachorro"].forEach(function(o){h+='<button class="chip" data-act="obs" data-v="'+o+'">+ '+o+"</button>"});
  h+='</div><textarea data-f="obs">'+esc(S.obs)+'</textarea><label class="check"><input type="checkbox" data-f="cons"'+(S.cons?" checked":"")+'><span>Aceito receber lembretes de manutenção. Posso cancelar quando quiser.</span></label><div class="err">'+S.err+"</div>"+bar("book","Confirmar agendamento",1);
 }else{
  var b=S.last;h='<div class="big"><div class="ic">✓</div><h2 style="margin-top:0">Agendado!</h2><p>'+dlabel(b.key.slice(0,10))+" às "+b.key.slice(11)+"</p></div>"+
  '<div class="card"><b>'+esc(b.svc)+(b.q?" · "+b.q+(b.q>1?" aparelhos":" aparelho"):"")+'</b><p>'+(b.val?"Valor estimado: "+brl(b.val):"Valor a combinar")+"</p><p>"+esc(b.addr)+"</p>"+(b.obs?"<p>"+esc(b.obs)+"</p>":"")+"</div>"+
  '<a class="wbtn" href="'+wcf(b)+'" target="_blank" rel="noopener"><span class="wi">💬</span><span><b>Confirmar pelo WhatsApp</b><small>Envie os dados do agendamento para o técnico</small></span></a><p style="margin-top:12px;text-align:center">Esse horário agora está bloqueado para outros clientes.</p><div class="bar"><button class="btn" data-act="again">Novo agendamento</button></div>';
 }
 return h;
}
function render(){
 var sub=document.getElementById("sub");
 if(sub)sub.textContent=TEC?"Agendamento com "+TEC.nome:"";
 document.getElementById("app").innerHTML=cli();
}
function go(n){S.step=n;S.err="";render();window.scrollTo(0,0)}
function reset(){S.q=1;S.cat="";S.tel="";S.step=0;S.who="";S.svc="";S.sym=[];S.day="";S.slot="";S.addr="";S.obs="";S.emp="";S.cnpj="";S.cont="";S.err=""}
async function carregarTecnico(){
 if(!SLUG){S.loading=0;S.notFound=1;render();return}
 var res=await sb.from("tecnicos").select("*").eq("slug",SLUG).maybeSingle();
 if(!res.data){S.loading=0;S.notFound=1;render();return}
 TEC=res.data;
 CFG.tel=TEC.whatsapp||"";
 if(TEC.config){
  if(TEC.config.sv)CFG.sv=TEC.config.sv;
  if(TEC.config.dw)CFG.dw=TEC.config.dw;
  if(TEC.config.hr)CFG.hr=TEC.config.hr;
  if(TEC.config.co)CFG.co=TEC.config.co;
  if(TEC.config.serv)Object.assign(SERV,TEC.config.serv);
 }
 var ag=await sb.from("agendamentos").select("data_hora").eq("tecnico_id",TEC.id);
 if(ag.data)S.ocupados=ag.data.map(function(x){return x.data_hora});
 S.loading=0;render();
}
document.addEventListener("click",async function(e){
 var b=e.target.closest("[data-act]");if(!b)return;var a=b.dataset.act,v=b.dataset.v;
 if(a==="who"){S.who=v;go(1);return}
 if(a==="svc"){S.svc=v;S.err="";render();return}
 if(a==="sym"){var i=S.sym.indexOf(v);i>-1?S.sym.splice(i,1):S.sym.push(v);render();return}
 if(a==="day"){S.day=v;S.slot="";S.err="";render();return}
 if(a==="slot"){S.slot=v;S.err="";render();return}
 if(a==="obs"){S.obs=(S.obs?S.obs+(S.obs.slice(-1)==="."?" ":". "):"")+v+".";render();return}
 if(a==="back"){go(S.step-1);return}
 if(a==="next"){
  if(S.step===2&&!S.svc){S.err="Escolha um serviço para continuar.";render();return}
  if(S.step===3&&!S.slot){S.err="Escolha um dia e um horário.";render();return}
  go(S.step+1);return}
 if(a==="book"){
  if(!S.addr.trim()||!S.cont.trim()||S.tel.replace(/\D/g,"").length<10||(S.who==="Empresa"&&!S.emp.trim())){S.err="Preencha nome, WhatsApp com DDD e endereço"+(S.who==="Empresa"?", além do nome da empresa":"")+".";render();return}
  S.saving=1;render();
  var sv=SERV[S.svc][0],ob=S.obs.trim();
  if(S.svc==="visita"&&S.sym.length)ob=("Sintomas: "+S.sym.join(", ")+(ob?". "+ob:""));
  var cf=CFG.sv[S.svc],q=cf.u?S.q:1,val=(!cf.ac&&cf.p)?cf.p*q:0,dh=S.day+" "+S.slot;
  var obsFinal=(S.who==="Empresa"?"Contato: "+S.cont.trim()+(S.cnpj.trim()?" | CNPJ: "+S.cnpj.trim():"")+(ob?" | "+ob:""):ob);
  var ins=await sb.from("agendamentos").insert({
   tecnico_id:TEC.id,
   data_hora:dh,
   cliente_nome:S.who==="Empresa"?S.emp.trim():S.cont.trim(),
   whatsapp:S.tel.trim(),
   servico:sv,
   who:S.who,
   endereco:S.addr.trim(),
   obs:obsFinal,
   qtd:cf.u?q:1,
   valor:val
  });
  S.saving=0;
  if(ins.error){S.err="Erro ao confirmar: "+ins.error.message;render();return}
  S.ocupados.push(dh);
  S.last={key:dh,name:S.who==="Empresa"?S.emp:S.cont,svc:sv,who:S.who,addr:S.addr,tel:S.tel,ct:S.cont,ap:S.cat?CATS[S.cat].n:"",obs:obsFinal,q:cf.u?q:0,val:val};
  go(5);return}
 if(a==="again"){reset();go(0);return}
 if(a==="cat"){S.cat=v;S.svc="";S.sym=[];go(2);return}
 if(a==="mm"){var nm=S.mo.m+ +v,ny=S.mo.y;if(nm<0){nm=11;ny--}if(nm>11){nm=0;ny++}S.mo={y:ny,m:nm};render();return}
 if(a==="qm"){S.q=Math.max(1,S.q-1);render();return}
 if(a==="qp"){S.q=Math.min(20,S.q+1);render();return}
});
document.addEventListener("input",function(e){var f=e.target.dataset.f;if(f)S[f]=e.target.type==="checkbox"?e.target.checked:e.target.value});
carregarTecnico();
</script>
</body>
</html>
